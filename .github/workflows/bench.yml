name: Bench

# Informational only: nothing here runs with --enforce and nothing here fails on
# a regression. (The micro suite's per-bench correctness guards DO fail hard — a
# bench that cannot prove it is doing its work must not report a number.) The
# gate against the committed baseline lives in bench-nightly.yml instead, where
# it cannot block a merge.
#
# Two jobs, two shapes:
#
# - `bench-quick` (manual, no `base` input): one run of the current ref, results
#   uploaded as an artifact for a human to read.
# - `bench-ab` (perf-sensitive PRs, or a manual run WITH a `base` input): two
#   refs measured ON THE SAME RUNNER, INTERLEAVED across rounds, posted as a
#   comment. A PR compares its base against its head; a dispatch compares any
#   two refs, so a candidate branch can be measured against `main` without
#   opening a PR — which is how a perf change gets judged before it is proposed.
#
# INTERLEAVED, because measuring base once and then head once cannot separate
# the change from the machine (#638). The head is always second, so every bit of
# drift, thermal state and cache warmth lands on its account: on #637, a PR that
# touched no package source at all, that read as +3.7%, +5.9% and +6.6% on three
# rows. Rounds alternate and counterbalance (even rounds base-first, odd rounds
# head-first) so a linear drift cancels in the paired deltas instead of accruing
# to one side, and a row is only called `improved`/`regressed` when every round
# agrees in sign AND the median delta clears the row's own run-to-run spread.
# A local null run — the same checkout on both sides — produced medians of
# -37.7% and -15.1% that the spread rule correctly refused to call.
#
# BOTH NOW RUN ON THE DEDICATED BENCH VM (org-level self-hosted runner, label
# `bench`). Three back-to-back quick runs there put every timing row above
# ~0.1 ms within 0.45-4.1 %, against the ±5 % this workflow used to see on a
# shared vCPU. What that does NOT fix is the sub-0.1 ms rows — `small-page`
# still swings 50 % (0.012-0.018 ms, sample count jumping 12 → 19971 between
# runs). That is timer resolution, not machine noise; no box fixes it, and
# INFORMATIONAL_TIMINGS already covers it.
#
# `bench-ab` remains the base-vs-head comparison even on a stable machine,
# because it is the measurement that needs no baseline at all and survives a
# change of hardware. What the VM adds is that its deltas are now worth
# believing at single-digit percentages.
#
# Deliberately NOT a required check and deliberately no `merge_group` trigger:
# nothing here may block a merge, so there is no context to go missing on the
# queue ref (cf. the comment in bundle-size.yml, which is the inverse case).
# That also means the merge queue never waits on the VM.
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'A/B "before" ref (sha, branch or tag). Leave EMPTY for a plain one-off run of this ref.'
        required: false
        type: string
      head:
        description: 'A/B "after" ref. Defaults to the ref this workflow was dispatched from.'
        required: false
        type: string
      rounds:
        description: 'Interleaved rounds per side (>= 2).'
        required: false
        default: '5'
        type: string
      enforce:
        description: 'Fail the job on a unanimous regression. The deliberate proof run — PR runs are never gated.'
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'benchmarks/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/bench.yml'

permissions: {}

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Starts the bench VM, which sits deallocated between runs so compute is billed
  # only while a benchmark is actually running.
  #
  # Runs on every event so the bench jobs can `needs:` it unconditionally — the
  # Azure steps are what is conditional, and a job whose only steps are skipped
  # still succeeds, so fork PRs pass through it in seconds.
  #
  # It WAITS for the VM rather than firing `--no-wait`. `timeout-minutes` does
  # not apply to a job still queued for a runner label that never appears: that
  # clock starts only once a runner picks the job up. A dead VM would therefore
  # leave the PR pending until GitHub's 24-hour unpicked-job limit. Blocking here
  # costs ~45s of hosted time and turns that into an immediate, visible failure.
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # OIDC only — no client secret exists for this app registration to leak.
      id-token: write
      contents: read
    steps:
      # Fork PRs are excluded for the same reason they are excluded from
      # `runs-on` below, and they cannot read secrets anyway, so `azure/login`
      # would fail confusingly rather than cleanly.
      #
      # DEPENDABOT is excluded for a related but distinct reason. Its PRs come
      # from a branch IN this repo, so the fork test above passes them — but a
      # Dependabot-triggered run gets a read-only token and cannot see regular
      # Actions secrets (they live in a separate Dependabot store). Without this
      # clause every dependency bump would fail `wake` on empty credentials and
      # paint a red X on a PR that has no business touching the bench VM.
      #
      # These conditions are written to FOLD to a single line — no continuation
      # is indented past the first. A more-indented line in a `>-` scalar keeps
      # its newline, and the expression then reaches Actions with a literal
      # newline inside it.
      - uses: azure/login@v2
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # `az vm start` on an already-running VM is a successful no-op, so
      # concurrent PRs racing to wake the same box is fine.
      - name: Start the bench VM
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
        env:
          RG: ${{ secrets.AZURE_RG }}
          VM: ${{ secrets.AZURE_VM_NAME }}
        run: |
          az vm start -g "$RG" -n "$VM"
          state=$(az vm get-instance-view -g "$RG" -n "$VM" \
            --query "instanceView.statuses[?starts_with(code,'PowerState/')].code | [0]" -o tsv)
          echo "power state: $state"
          [ "$state" = "PowerState/running" ] || {
            echo "::error::Bench VM did not reach a running state ($state)."
            exit 1
          }

  bench-quick:
    # A dispatch with no `base` input is a plain one-off run of this ref. Give
    # it a `base` and you get the A/B job below instead.
    if: github.event_name == 'workflow_dispatch' && inputs.base == ''
    needs: wake
    # `workflow_dispatch` requires write access on a branch of this repo, so
    # there is no fork exposure here and this can take the VM unconditionally.
    runs-on: [self-hosted, linux, x64, bench]
    timeout-minutes: 45
    # The workflow-level `permissions: {}` leaves this job with a token that
    # cannot even clone — this job had no block at all before that line existed.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # The benchmarks run erasable TS directly via `node` (type stripping).
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Quick SSR bench (informational)
        run: pnpm bench:ssr:quick

      - name: Request-path micro bench (informational)
        run: pnpm bench:micro

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: |
            benchmarks/results/quick-latest.json
            benchmarks/results/micro-latest.json

  bench-ab:
    if: github.event_name == 'pull_request' || inputs.base != ''
    needs: wake
    # A PR from a branch of this repo goes to the bench VM; a PR from a FORK
    # stays on `ubuntu-latest`, non-negotiably. Fork PRs run the workflow file
    # *from the fork*, so a self-hosted runner on a public repo is arbitrary
    # code execution inside our Azure subscription. Forks still get their A/B,
    # on the noisy box, which is exactly what they had before this change.
    #
    # DEPENDABOT likewise stays on `ubuntu-latest`. Its PRs are same-repo, so
    # the fork test passes them, but its runs get a read-only token and no
    # access to Actions secrets — `wake` cannot start the VM for them, and a
    # dependency bump does not need the quiet machine anyway.
    #
    # Kept on ONE line on purpose: in a YAML folded scalar (`>-`) a line
    # indented further than the first is preserved verbatim, newline and all, so
    # a pretty-wrapped version of this reaches Actions with literal newlines in
    # it.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","bench"]') || 'ubuntu-latest' }}
    # Two installs, two builds, then 2xR quick suites. The VM turns a quick
    # suite in ~20s, so the default 5 rounds add ~200s to what this job already
    # cost. The ceiling is for a hang, not for a slow run.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    env:
      # A PR compares its base against its head. A dispatch compares whatever
      # two refs it was given, which is what makes "measure this candidate
      # against main" possible without opening a PR at all.
      BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base }}
      HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (inputs.head != '' && inputs.head || github.sha) }}
      ROUNDS: ${{ github.event_name == 'pull_request' && '5' || inputs.rounds }}
    steps:
      # fetch-depth 0: the base ref is checked out as a WORKTREE of this clone,
      # so its commit must already be here.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_REF }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      # A WORKTREE rather than `git checkout --detach` in place, because the two
      # sides now have to exist SIMULTANEOUSLY: rounds alternate between them,
      # and re-checking-out and rebuilding per round would cost more than the
      # measurement and reintroduce exactly the drift the interleaving removes.
      #
      # `worktree prune` first: this runner is self-hosted and reuses its
      # workspace, so a registration left behind by a killed job would otherwise
      # make `worktree add` fail on a path that no longer exists.
      - name: Check out the base ref alongside
        run: |
          set -euo pipefail
          git worktree prune
          rm -rf "$RUNNER_TEMP/base"
          # Resolve locally FIRST. A PR's base sha is already in the clone
          # (fetch-depth: 0 above), and `git fetch origin <sha>` is not a
          # refspec fetch — it would fail on the common case and drop us into
          # the all-branches fallback on every PR run, for nothing.
          # Only a dispatch naming a ref this clone has never seen needs the
          # network.
          if ! base_sha=$(git rev-parse --verify --quiet "$BASE_REF^{commit}"); then
            git fetch --no-tags --force origin "$BASE_REF" 2>/dev/null \
              || git fetch --no-tags --force origin "+refs/heads/*:refs/remotes/origin/*"
            base_sha=$(git rev-parse --verify --quiet "$BASE_REF^{commit}" \
              || git rev-parse --verify "origin/$BASE_REF^{commit}" \
              || git rev-parse --verify FETCH_HEAD)
          fi
          echo "base $BASE_REF -> $base_sha"
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          # HEAD_REF may be a branch name on a dispatch, so resolve it too —
          # the report title abbreviates to 7 characters and would otherwise
          # print the first 7 letters of a branch name.
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/base" "$base_sha"

      # Each side builds in its own tree, so there is no stale-dist hazard to
      # clean up between them — the reason the old job needed `rm -rf
      # packages/*/dist` was that both refs shared one working directory.
      - name: Install and build both sides
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          cd "$RUNNER_TEMP/base"
          pnpm install --frozen-lockfile
          pnpm build

      # ab.ts runs each side's OWN quick.ts by path, never through a pnpm
      # script: the base ref is an arbitrary older commit and need not define a
      # script name the head introduces.
      - name: Interleaved A/B
        run: |
          node --conditions production benchmarks/src/ab.ts \
            --base-dir="$RUNNER_TEMP/base" \
            --head-dir="$GITHUB_WORKSPACE" \
            --rounds="$ROUNDS" \
            --out="$RUNNER_TEMP/rounds.json"

      # The HEAD checkout's reporter, so a PR that changes the verdict rules is
      # read by the version it ships.
      #
      # `--enforce` ONLY on a dispatch that asked for it. A PR run reports and
      # never fails: this workflow is not a required check and has no
      # merge_group trigger precisely so the VM can never block a merge, and a
      # job that can fail on numbers would quietly undo that.
      - name: Report
        run: |
          node --conditions production benchmarks/src/ab-report.ts \
            --rounds-file="$RUNNER_TEMP/rounds.json" \
            --markdown="$RUNNER_TEMP/bench.md" \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.enforce) && '--enforce' || '' }} \
            --title="base \`${BASE_SHA:0:7}\` (before) → head \`${HEAD_SHA:0:7}\` (after), interleaved over $ROUNDS rounds on this runner."

      # always(): an --enforce failure above must still publish the table that
      # explains it, or the run reports a verdict nobody can read.
      - name: Job summary
        if: always()
        run: cat "$RUNNER_TEMP/bench.md" >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get a read-only token on `pull_request`, so the comment call
      # would 403. The job summary above still carries the table for those.
      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- sigx-bench-ab -->';
            const body = marker + '\n' + fs.readFileSync(process.env.RUNNER_TEMP + '/bench.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            // One comment per PR, updated in place — a push should refresh the
            // numbers, not bury the thread under a new table each time.
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-ab-results
          path: |
            ${{ runner.temp }}/rounds.json
            ${{ runner.temp }}/bench.md
          if-no-files-found: ignore

      # This runner is self-hosted and keeps its workspace between jobs. A
      # worktree registration left in .git outlives RUNNER_TEMP being cleaned,
      # and the next run's `worktree add` would then fail on a stale path.
      - name: Remove the base worktree
        if: always()
        run: |
          git worktree remove --force "$RUNNER_TEMP/base" 2>/dev/null || true
          git worktree prune
